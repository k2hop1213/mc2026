; =============================================================
;  마이크로컨트롤러응용 2026 - PlatformIO 프로젝트 설정
; =============================================================
;  이 파일 하나가 Windows / macOS 양쪽의 툴체인을 결정합니다.
;  절대 임의로 수정하지 마세요. 수정이 필요하면 조교에게 문의.
;
;  공식 문서: https://docs.platformio.org/en/latest/projectconf/
; =============================================================

[platformio]
default_envs = w09_assignment
; 보드를 꽂지 않아도 빌드 검증이 되도록 기본 env를 명시

; -------------------------------------------------------------
; [env] : 모든 환경이 공통으로 상속하는 설정
; -------------------------------------------------------------
[env]
; --- 버전 고정 (재현성의 핵심) ---
; 아래 두 줄 때문에 어떤 PC에서 clone 하든 동일한 컴파일러/코어를 받습니다.
platform = atmelavr@5.3.0
platform_packages =
	platformio/framework-arduino-avr@5.4.0
	platformio/toolchain-atmelavr@3.70300.220127
	platformio/tool-avrdude@1.80100.0

framework = arduino
board = uno

; --- 시리얼 모니터 ---
monitor_speed = 9600
monitor_filters = default, time
monitor_echo = yes

; --- 경고 옵션 ---
; build_src_flags 는 src/ 의 "학생 코드"에만 적용됩니다.
; (Arduino 코어까지 -Wall 을 걸면 남의 코드 경고가 쏟아져서 안 씁니다)
build_src_flags =
	-Wall
	-Wextra

; --- 정적 분석: pio check ---
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style --inline-suppr
check_src_filters = +<src/>

; -------------------------------------------------------------
; [env:uno] : Arduino Uno R3 (ATmega328P, 16MHz)
; -------------------------------------------------------------
[env:uno]
build_src_filter = +<w01_led/01_led/>

; 포트는 비워두면 PlatformIO 가 자동으로 찾습니다.
; 자동 인식이 실패할 때만 아래 주석을 풀고 본인 포트를 적으세요.
;   Windows : COM3, COM7 ...      ($ pio device list 로 확인)
;   macOS   : /dev/cu.usbserial-1420, /dev/cu.usbmodem14101 ...
;             ※ tty. 가 아니라 반드시 cu. 로 시작하는 쪽을 쓸 것
; upload_port = COM3
; monitor_port = COM3

; --- 라이브러리는 여기에 추가 (버전까지 반드시 명시) ---
; lib_deps =
;	adafruit/Adafruit SSD1306@2.5.13
;	paulstoffregen/OneWire@2.3.8

[env:w01_led]
build_src_filter = +<w01_led/01_led/>

; 1주차 과제
[env:w01_assignment]
build_src_filter = +<w01_led/assignment/>

; 2주차 인터럽트 실습
[env:w02_interrupt]
build_src_filter = +<w02_interrupt/01_interrupt/>
[env:w02_assignment]
build_src_filter = +<w02_interrupt/assignment/>

; 3주차 UART 실습
[env:w03_uart_tx_char]
build_src_filter = +<w03_uart/01_tx_char/>
[env:w03_uart_tx_str]
build_src_filter = +<w03_uart/02_tx_str/>
[env:w03_uart_printf]
build_src_filter = +<w03_uart/03_printf/>
[env:w03_uart_string_cmd]
build_src_filter = +<w03_uart/04_string_cmd/>
[env:w03_uart_protocol]
build_src_filter = +<w03_uart/05_protocol/>
[env:w03_assignment]
build_src_filter = +<w03_uart/assignment/>

; 4주차(5차시) ADC 실습
[env:w04_adc_print]
build_src_filter = +<w04_adc/01_adc_print/>
[env:w04_adc_led]
build_src_filter = +<w04_adc/02_adc_led/>
[env:w04_cds_print]
build_src_filter = +<w04_adc/03_cds_print/>
[env:w04_cds_led]
build_src_filter = +<w04_adc/04_cds_led/>
[env:w04_assignment]
build_src_filter = +<w04_adc/assignment/>

; 6차시 Timer 실습
[env:w06_normal_ovf]
build_src_filter = +<w06_timer/01_normal_ovf/>
[env:w06_ctc]
build_src_filter = +<w06_timer/02_ctc/>
[env:w06_buzzer]
build_src_filter = +<w06_timer/03_buzzer/>
[env:w06_scale]
build_src_filter = +<w06_timer/04_scale/>

; 7차시 NeoPixel 실습 (라이브러리는 이 env 들에만 붙인다)
[neopixel]
lib_deps =
	adafruit/Adafruit NeoPixel@1.15.5

[env:w07_blink]
build_src_filter = +<w07_neopixel/01_blink/>
lib_deps = ${neopixel.lib_deps}
[env:w07_rgbw]
build_src_filter = +<w07_neopixel/02_rgbw/>
lib_deps = ${neopixel.lib_deps}
[env:w07_position]
build_src_filter = +<w07_neopixel/03_position/>
lib_deps = ${neopixel.lib_deps}
[env:w07_shift]
build_src_filter = +<w07_neopixel/04_shift/>
lib_deps = ${neopixel.lib_deps}
[env:w07_brightness]
build_src_filter = +<w07_neopixel/05_brightness/>
lib_deps = ${neopixel.lib_deps}
[env:w07_assignment]
build_src_filter = +<w07_neopixel/assignment/>
lib_deps = ${neopixel.lib_deps}

; 8차시 온습도센서 DHT22 (라이브러리는 이 env 들에만 붙인다)
[dht]
lib_deps =
	adafruit/DHT sensor library@1.4.6
	adafruit/Adafruit Unified Sensor@1.1.15

[env:w08_print]
build_src_filter = +<w08_dht/01_print/>
lib_deps = ${dht.lib_deps}
[env:w08_bar]
build_src_filter = +<w08_dht/02_humidity_bar/>
lib_deps = ${dht.lib_deps}
[env:w08_raw]
build_src_filter = +<w08_dht/03_raw/>

; 9차시 초음파센서 HC-SR04 (라이브러리 없음)
[env:w09_print]
build_src_filter = +<w09_ultrasonic/01_print/>
[env:w09_bar]
build_src_filter = +<w09_ultrasonic/02_led_bar/>
[env:w09_assignment]
build_src_filter = +<w09_ultrasonic/assignment/>

; 10차시 서보모터 SG90 (라이브러리 없음, Timer1 사용)
[env:w10_pulse]
build_src_filter = +<w10_servo/01_pulse/>
[env:w10_sweep]
build_src_filter = +<w10_servo/02_sweep/>
[env:w10_pot]
build_src_filter = +<w10_servo/03_pot/>

; 시험 대비 도구 : 조교 프로그램이 보내는 바이트를 LED 로 확인
[env:tool_byte_monitor]
build_src_filter = +<tools/byte_monitor/>

; 시험 대비 프로토콜 연습
[env:w05_binary]
build_src_filter = +<w05_protocol/01_binary/>
[env:w05_len]
build_src_filter = +<w05_protocol/02_len/>
[env:w05_checksum]
build_src_filter = +<w05_protocol/03_checksum/>
[env:w05_response]
build_src_filter = +<w05_protocol/04_response/>
[env:w05_adc]
build_src_filter = +<w05_protocol/05_adc/>
[env:w05_switch]
build_src_filter = +<w05_protocol/06_switch_event/>
[env:tool_byte_recorder]
build_src_filter = +<tools/byte_recorder/>
[env:tool_hw_check]
build_src_filter = +<tools/hw_check/>

; 시험용 통합 틀
[env:exam_base]
build_src_filter = +<exam/base/>

; 시험 대비 도구 : A0 ~ A5 전체 값 출력
[env:tool_adc_scan]
build_src_filter = +<tools/adc_scan/>

; 시험 풀이
[env:exam_solve]
build_src_filter = +<exam/solve/>
monitor_speed = 38400

; 시험용 통합 틀 (레지스터 버전, Arduino 함수 없음)
[env:exam_avr]
framework =
build_src_filter = +<exam/base_avr/>
