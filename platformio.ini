; =============================================================
;  마이크로컨트롤러응용 2026 - PlatformIO 프로젝트 설정
; =============================================================
;  이 파일 하나가 Windows / macOS 양쪽의 툴체인을 결정합니다.
;  절대 임의로 수정하지 마세요. 수정이 필요하면 조교에게 문의.
;
;  공식 문서: https://docs.platformio.org/en/latest/projectconf/
; =============================================================

[platformio]
default_envs = w04_adc_print
; 보드를 꽂지 않아도 빌드 검증이 되도록 기본 env를 명시

; -------------------------------------------------------------
; [env] : 모든 환경이 공통으로 상속하는 설정
; -------------------------------------------------------------
[env]
; --- 버전 고정 (재현성의 핵심) ---
; 아래 두 줄 때문에 어떤 PC에서 clone 하든 동일한 컴파일러/코어를 받습니다.
platform = atmelavr@5.3.0
platform_packages =
	platformio/framework-arduino-avr@5.4.0
	platformio/toolchain-atmelavr@3.70300.220127
	platformio/tool-avrdude@1.80100.0

framework = arduino
board = uno

; --- 시리얼 모니터 ---
monitor_speed = 9600
monitor_filters = default, time
monitor_echo = yes

; --- 경고 옵션 ---
; build_src_flags 는 src/ 의 "학생 코드"에만 적용됩니다.
; (Arduino 코어까지 -Wall 을 걸면 남의 코드 경고가 쏟아져서 안 씁니다)
build_src_flags =
	-Wall
	-Wextra

; --- 정적 분석: pio check ---
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style --inline-suppr
check_src_filters = +<src/>

; -------------------------------------------------------------
; [env:uno] : Arduino Uno R3 (ATmega328P, 16MHz)
; -------------------------------------------------------------
[env:uno]
build_src_filter = +<w01_led/01_led/>

; 포트는 비워두면 PlatformIO 가 자동으로 찾습니다.
; 자동 인식이 실패할 때만 아래 주석을 풀고 본인 포트를 적으세요.
;   Windows : COM3, COM7 ...      ($ pio device list 로 확인)
;   macOS   : /dev/cu.usbserial-1420, /dev/cu.usbmodem14101 ...
;             ※ tty. 가 아니라 반드시 cu. 로 시작하는 쪽을 쓸 것
; upload_port = COM3
; monitor_port = COM3

; --- 라이브러리는 여기에 추가 (버전까지 반드시 명시) ---
; lib_deps =
;	adafruit/Adafruit SSD1306@2.5.13
;	paulstoffregen/OneWire@2.3.8

[env:w01_led]
build_src_filter = +<w01_led/01_led/>

; 1주차 과제
[env:w01_assignment]
build_src_filter = +<w01_led/assignment/>

; 2주차 인터럽트 실습
[env:w02_interrupt]
build_src_filter = +<w02_interrupt/01_interrupt/>
[env:w02_assignment]
build_src_filter = +<w02_interrupt/assignment/>

; 3주차 UART 실습
[env:w03_uart_tx_char]
build_src_filter = +<w03_uart/01_tx_char/>
[env:w03_uart_tx_str]
build_src_filter = +<w03_uart/02_tx_str/>
[env:w03_uart_printf]
build_src_filter = +<w03_uart/03_printf/>
[env:w03_uart_string_cmd]
build_src_filter = +<w03_uart/04_string_cmd/>
[env:w03_uart_protocol]
build_src_filter = +<w03_uart/05_protocol/>
[env:w03_assignment]
build_src_filter = +<w03_uart/assignment/>

; 4주차(5차시) ADC 실습
[env:w04_adc_print]
build_src_filter = +<w04_adc/01_adc_print/>
[env:w04_adc_led]
build_src_filter = +<w04_adc/02_adc_led/>
[env:w04_cds_print]
build_src_filter = +<w04_adc/03_cds_print/>
[env:w04_cds_led]
build_src_filter = +<w04_adc/04_cds_led/>

; 시험 대비 도구 : 조교 프로그램이 보내는 바이트를 LED 로 확인
[env:tool_byte_monitor]
build_src_filter = +<tools/byte_monitor/>
